# nginx de la web publica (solucionesdentalesarf.com). Oct 2026.
# Igual al default.conf de nginx:alpine + un proxy al turnero del CRM, asi la
# web llama a /api/public/turnero/* desde su propio dominio (sin CORS).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Turnero (motivos, horarios, reserva, estado). Variable + resolver: si el
    # DNS del CRM falla al arrancar, nginx igual levanta (no tira la web).
    location /api/public/turnero/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $crm_upstream https://crm.solucionesdentalesarf.com;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.solucionesdentalesarf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Postulaciones laborales (/postulate, oct 2026): mismo proxy al CRM.
    # Admite fotos de trabajos: hasta 6 fotos + la lista de aranceles.
    location = /api/public/postulaciones {
        client_max_body_size 40m;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $crm_upstream https://crm.solucionesdentalesarf.com;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.solucionesdentalesarf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
