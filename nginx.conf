# nginx de la web publica (solucionesdentalesarf.com). Oct 2026.
# Igual al default.conf de nginx:alpine + un proxy al turnero del CRM, asi la
# web llama a /api/public/turnero/* desde su propio dominio (sin CORS).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Nov 2026: una sola direccion. La web respondia igual con y sin "www" (dos
    # sitios para el pixel y para Google); sin "www" redirige a "www" conservando
    # la ruta y los parametros del anuncio (utm, fbclid).
    if ($host = solucionesdentalesarf.com) {
        return 301 https://www.solucionesdentalesarf.com$request_uri;
    }

    # Nov 2026: comprimir lo que es texto (la pagina viajaba sin comprimir).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Turnero (motivos, horarios, reserva, estado). Variable + resolver: si el
    # DNS del CRM falla al arrancar, nginx igual levanta (no tira la web).
    location /api/public/turnero/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $crm_upstream https://crm.solucionesdentalesarf.com;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.solucionesdentalesarf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Postulaciones laborales (/postulate, oct 2026): mismo proxy al CRM.
    # Admite fotos de trabajos: hasta 6 fotos + la lista de aranceles.
    location = /api/public/postulaciones {
        client_max_body_size 40m;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $crm_upstream https://crm.solucionesdentalesarf.com;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.solucionesdentalesarf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Encuesta a odontólogos (/odontologos, nov 2026): mismo proxy al CRM.
    location = /api/public/encuesta-odontologos {
        client_max_body_size 64k;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $crm_upstream https://crm.solucionesdentalesarf.com;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.solucionesdentalesarf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
