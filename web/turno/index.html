    {id:'no_se',label:'Consulta de evaluación',desc:'No sé qué tengo: me revisan y me dicen qué necesito',available:false}
  ];

  // Sedes: referencia para llegar y link al mapa (12/11/2026, Alejo: "la gente no lee").
  var SEDES = [
    {k:/hait/i, n:'Haití 26', ref:'A la altura de Av. Avellaneda al 500, cerca del parque 9 de Julio.', nota:'Primer piso por escalera.', q:'Haití 26, San Miguel de Tucumán'},
    {k:/vittalia|santiago\s*157/i, n:'Torre Vittalia · Santiago 157', ref:'Entre Balcarce y Monteagudo.', nota:'', q:'Santiago del Estero 157, San Miguel de Tucumán'}
  ];
  function sedeInfo(nombre){
    for (var i=0;i<SEDES.length;i++){ if (SEDES[i].k.test(nombre||'')) return SEDES[i]; }
    return {n: nombre||'', ref:'', nota:'', q:(nombre||'')+', San Miguel de Tucumán'};
  }
  function mapaUrl(si){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(si.q); }
  function rolDe(m){
    if (!m) return 'Profesional';
    if (m.id==='protesis') return 'Profesional de prótesis';
    if (m.id==='placa_relajacion' || m.id==='placa_contencion') return 'Profesional de placas';
    if (m.id==='ortodoncia') return 'Profesional de ortodoncia';
    return 'Profesional';
  }
  function sedeCard(nombre){
    var si = sedeInfo(nombre);
    return '<div class="sede"><span class="bub"><svg class="ic"><use href="#i-pin"/></svg></span><div><b>'+esc(si.n)+'</b>'+
      '<small>San Miguel de Tucumán'+(si.ref?' · '+esc(si.ref):'')+(si.nota?' '+esc(si.nota):'')+'</small>'+
      '<a href="'+esc(mapaUrl(si))+'" target="_blank" rel="noopener">Ver en el mapa</a></div></div>';
  }

  function pick(id, hint){
    st.motivo=id; st.slots=null; st.day=null; st.slot=null; st.error=''; st.hint=hint||''; st.apartado=null; st.buscan=null; st.aviso=''; pararReloj();
    st.revisar = false; st.abierto = false;
    // Embudo del pixel: eligio motivo (una vez por motivo y por visita).
    if (mot(id) && mot(id).available) trackUnaVez('ViewContent', 'm_'+id, {content_name: mot(id).label, content_category: 'turnero'});
    if (id === 'no_se') { render(); scrollCol2(); return; }
    if (st.cfg.enabled && mot(id) && mot(id).available) loadSlots(); else render();
    scrollCol2();
  }
  function scrollCol2(){ if (window.innerWidth < 1060) { setTimeout(function(){ var c=document.getElementById('col2'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); },60); } }
  // eligio "que me revisen" dentro de la ayuda -> consulta de evaluacion
  function revisar(){
    st.revisar = true; st.hint=''; st.slots=null; st.day=null; st.slot=null; st.error='';
    var m = mot('no_se');
    if (st.cfg.enabled && m && m.available) loadSlots(); else render();
  }

  function loadSlots(){
    st.loadingSlots=true; st.slotsError=''; render();
    ARF.api('/slots?motivo='+encodeURIComponent(st.motivo)+'&v='+encodeURIComponent(VID)).then(function(r){
      st.slots = r.options || [];
      st.buscan = r.buscan || null;
      st.day = st.slots.length ? parts(st.slots[0].slot_iso).key : null;
    }).catch(function(e){ st.slots=[]; st.slotsError='No pudimos traer los horarios. Probá de nuevo o escribinos por WhatsApp.'; })
    .then(function(){ st.loadingSlots=false; render(); });
  }

  // ---------- reloj del horario apartado y "N personas buscan" ----------
  var _tic = null;
  function mmss(seg){ seg = Math.max(0, Math.round(seg)); var m=Math.floor(seg/60), x=seg%60; return (m<10?'0':'')+m+':'+(x<10?'0':'')+x; }
  function holdHtml(){
    if (st.apartado && st.apartado.fin > Date.now())
      return '<b>Te guardamos este horario</b> <span class="reloj" id="hold-clock">'+mmss((st.apartado.fin-Date.now())/1000)+'</span><br><span class="hold-sub">Completá tus datos y pagá antes de que se libere.</span>';
    return 'Al continuar te guardamos el horario '+((st.cfg&&st.cfg.hold_minutes)||15)+' minutos mientras pagás.';
  }
  // Numeros reales que manda el CRM (personas distintas de la ultima semana, sin
  // contar a quien mira). Con menos de 2 no se muestra nada.
  function buscanTexto(conHorario){
    var b = st.buscan; if (!b) return '';
    if (conHorario && b.horario >= 2) return b.horario+' personas buscan este turno';
    if (b.motivo >= 2) { var t = (MOT_TXT[st.motivo]||[(mot(st.motivo)||{}).label||''])[0].toLowerCase();
      return b.motivo+' personas buscan turno de '+t+' esta semana'; }
    return '';
  }
  function buscanHtml(conHorario, claro){ var t = buscanTexto(conHorario); return t ? '<div class="buscan'+(claro?' claro':'')+'"><span class="pt"></span>'+esc(t)+'</div>' : ''; }
  function pararReloj(){ if (_tic) { clearInterval(_tic); _tic = null; } }
  function arrancarReloj(){
    pararReloj();
    _tic = setInterval(function(){
      if (!st.apartado) return pararReloj();
      var falta = (st.apartado.fin - Date.now())/1000;
      var el = document.getElementById('hold-clock');
      if (falta > 0) { if (el) el.textContent = mmss(falta); return; }
      // se vencio: el horario se libera de verdad
      pararReloj(); st.apartado = null; st.slot = null;
      st.aviso = 'Se venció el tiempo y liberamos el horario. Si sigue disponible, elegilo de nuevo.';
      loadSlots();
    }, 1000);
  }
  function apartar(slot){
    st.apartado = null; pararReloj();
    ARF.api('/apartar', {method:'POST', body:{motivo: st.motivo, slot_iso: slot.slot_iso, profesional: slot.profesional, visitor: VID}}).then(function(r){
      if (st.slot !== slot) return;               // ya eligio otro
      if (r.buscan) st.buscan = r.buscan;
      if (r.apartado && r.segundos > 0) { st.apartado = {fin: Date.now() + r.segundos*1000}; arrancarReloj(); }
      // se actualizan solo estos dos recuadros: el formulario no se toca
      var hb = document.getElementById('hold-box'); if (hb) hb.innerHTML = holdHtml();
      var bb = document.getElementById('buscan-box'); if (bb) bb.innerHTML = buscanHtml(true);
    }).catch(function(e){
      if (st.slot !== slot) return;
      if (e && e.status === 409) { st.slot = null; st.aviso = 'Ese horario se acaba de ocupar. Elegí otro.'; loadSlots(); }
      // cualquier otra falla: sigue sin reloj, como antes
    });
  }

  // ---------- render ----------
  function carState(){
    var o = {day: st.day};
    app.querySelectorAll('[data-car]').forEach(function(c){ var t=c.querySelector('.days,.slots'); if(t) o[c.getAttribute('data-car')] = t.scrollLeft; });
    return o;
  }
  function carInit(prev){
    app.querySelectorAll('[data-car]').forEach(function(c){
      var k = c.getAttribute('data-car'), t = c.querySelector('.days,.slots');
      if (!t) return;
      function upd(){
        c.classList.toggle('has-prev', t.scrollLeft > 4);
        c.classList.toggle('has-next', t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
      }
      if (prev && prev[k] != null && (k === 'days' || prev.day === st.day)) t.scrollLeft = prev[k];
      else {
        var on = t.querySelector('[aria-checked="true"]');
        if (on) t.scrollLeft = Math.max(0, on.offsetLeft - t.offsetLeft - 8);
      }
      t.addEventListener('scroll', upd, {passive:true});
      c.querySelectorAll('.car-btn').forEach(function(b){ b.addEventListener('click', function(){
        t.scrollBy({left: (b.classList.contains('next')?1:-1) * Math.max(120, t.clientWidth*0.8), behavior:'smooth'});
      }); });
      upd();
    });
  }
  function render(){
    var _car = carState();
    var cfg=st.cfg, m=mot(st.motivo);
    var stepOn = st.slot ? 3 : (st.motivo ? 2 : 1);
    var h = '';
    h += '<div class="tn-steps" aria-hidden="true"><span class="on"></span><span class="'+(stepOn>=2?'on':'')+'"></span><span class="'+(stepOn>=3?'on':'')+'"></span></div>';
    h += '<div class="tn-kicker">Paso '+stepOn+' de 3 <a class="tn-wa" href="https://wa.me/5493815477474" target="_blank" rel="noopener">¿Dudas? WhatsApp</a></div>';
    h += '<h1>Sacá tu turno</h1>';
    // 16/11/2026: con el motivo ya elegido (llega desde una pagina de servicio o
    // ya lo toco) la entrada se achica a una linea: los horarios suben.
    var corto = !!mot(st.motivo);
    if (corto) h += '<p class="tn-lead" style="margin-bottom:18px">Consulta de <b>'+money(cfg.consulta_ars)+'</b>. Si ese día arrancás tu tratamiento, se descuenta.</p>';
    else h += '<p class="tn-lead">Siempre empezás con una consulta de <b>'+money(cfg.consulta_ars)+'</b>. Según el motivo, te asignamos la profesional y la sede que corresponden, y ves todo antes de pagar.</p>';
    if (!corto) h += '<ul class="tn-pts">'+
      '<li><svg class="ic"><use href="#i-pin"/></svg>Atendemos en San Miguel de Tucumán</li>'+
      '<li><svg class="ic"><use href="#i-check"/></svg>La profesional te revisa y te dice qué necesitás y cuánto sale</li>'+
      '<li><svg class="ic"><use href="#i-check"/></svg>Si ese día arrancás tu tratamiento, los '+money(cfg.consulta_ars)+' se descuentan</li>'+
      '</ul>';
    h += '<div class="tn-grid">';

    // col 1: motivos
    h += '<div class="tn-col"><h2>¿Por qué querés consultar?</h2><div class="mot-list" role="radiogroup" aria-label="Motivo de consulta">';
    // 16/11/2026: con el motivo elegido la lista se pliega (queda el elegido y
    // "Cambiar"), asi los horarios quedan a la vista sin bajar.
    var plegada = !!m && !st.abierto;
    cfg.motivos.forEach(function(x){
      var on = x.id===st.motivo;
      if (plegada && !on) return;
      h += '<button class="mot'+((x.available||x.id==='no_se')?'':' off')+'" role="radio" aria-checked="'+on+'" data-mot="'+esc(x.id)+'">'+(MOT_ICO[x.id]?'<span class="mi" aria-hidden="true"><svg viewBox="0 0 64 64">'+MOT_ICO[x.id]+'</svg></span>':'')+'<span class="mt"><b>'+esc((MOT_TXT[x.id]||[x.label])[0])+'</b><small>'+esc((MOT_TXT[x.id]||[0,x.desc])[1])+'</small></span>'+
           ((x.available||x.id==='no_se')?'<span class="dot"></span>':'<span class="soon">No disponible por ahora</span>')+'</button>';
    });
    h += '</div>';
    if (plegada && cfg.motivos.length > 1) h += '<p class="mini" style="margin:10px 2px 0"><button class="lnk" data-cambiar>Cambiar motivo de consulta</button></p>';
    h += '</div>';

    // col 2
    h += '<div class="tn-col" id="col2">';
    if (m && st.hint) h += '<div class="hint">Por lo que nos contás (<i>'+esc(st.hint.toLowerCase())+'</i>), te conviene la <b>'+esc(m.label)+'</b>. <button class="lnk" data-mot="no_se">Cambiar</button></div>';
    if (!m) {
      h += '<div class="card empty"><p style="margin:0">Elegí un motivo de consulta para ver la profesional, la sede y los horarios disponibles.</p></div>';
    } else if (m.id === 'no_se' && !st.revisar) {
      h += ayudaCard();
    } else if (!m.available) {
      h += noDisponible(m);
    } else if (!cfg.enabled) {
      h += porWhatsApp(m);
    } else if (st.loadingSlots) {
      h += '<div class="card"><div class="spinner" role="status" aria-label="Buscando horarios"></div></div>';
    } else if (st.slotsError) {
      h += '<div class="card"><div class="err">'+esc(st.slotsError)+'</div></div>';
    } else if (!st.slots || !st.slots.length) {
      h += '<div class="card empty"><div class="em-ic"><svg class="ic"><use href="#i-calx"/></svg></div><h3>No hay horarios libres en los próximos días</h3><p>Escribinos y te avisamos apenas se libere un turno para '+esc(m.label.toLowerCase())+'.</p><a class="btn btn-wa" data-wa-msg href="'+esc(ARF.waUrl('Hola! Quiero sacar turno para '+m.label+' y no encontré horarios en la web'))+'" target="_blank" rel="noopener">Escribinos por WhatsApp</a></div>';
    } else {
      if (st.aviso) h += '<div class="card" style="margin-bottom:12px"><div class="err">'+esc(st.aviso)+'</div></div>';
      h += buscanHtml(false, true);
      h += slotsCard();
    }
    h += '</div>';

    // col 3: resumen
    h += '<div class="tn-col" id="col3">' + (st.slot && cfg.enabled ? resumen() : '') + '</div>';
    h += '</div>';
    app.innerHTML = h;
    bind(_car);
  }

  function ayudaCard(){
    var h = '<div class="card"><span class="k-label">No sé qué tengo</span><h3 style="font-size:1.4rem;margin-bottom:6px">¿Qué te pasa?</h3>';
    h += '<p class="mini" style="font-size:.95rem;margin-bottom:16px">Elegí lo que más se parezca y te decimos qué consulta sacar.</p><div class="ayuda">';
    AYUDA.forEach(function(a, i){ h += '<button class="mot" data-ayuda="'+i+'"><span><b>'+esc(a.t)+'</b></span><span class="dot"></span></button>'; });
    h += '</div><p class="mini" style="margin:16px 0 0">Si tenés dolor fuerte, hinchazón o sangrado, <a data-wa-msg href="'+esc(ARF.waUrl('Hola! Tengo una urgencia dental'))+'" target="_blank" rel="noopener"><b>escribinos directo por WhatsApp</b></a>.</p></div>';
    return h;
  }

  function noDisponible(m){
    if (m.id === 'no_se') {
      return '<div class="card"><span class="k-label">'+esc(m.label)+'</span><h3 style="font-size:1.4rem;margin-bottom:8px">Por ahora lo vemos por WhatsApp</h3>'+
        '<p class="mini" style="font-size:.95rem;margin-bottom:18px">Contanos qué te pasa y te decimos qué consulta te conviene y con quién.</p>'+
        '<a class="btn btn-wa" data-wa-msg href="'+esc(ARF.waUrl('Hola! No sé qué tengo y quería que me revisen'))+'" target="_blank" rel="noopener">Contanos por WhatsApp</a>'+
        '<p class="mini" style="margin:16px 0 0"><button class="lnk" data-mot="no_se">Volver a las opciones</button></p></div>';
    }
    var act = activeMotivos();
    var h = '<div class="card empty"><div class="em-ic"><svg class="ic"><use href="#i-calx"/></svg></div>';
    h += '<span class="soon">'+esc(m.label)+'</span><h3 style="margin-top:12px">No disponible por ahora</h3>';
    h += '<p>En este momento no tenemos una profesional activa para este servicio. Escribinos y te avisamos apenas abramos turnos.</p>';

    if (act.length) {
      h += '<p class="mini" style="margin:22px 0 0">Mientras tanto, podés sacar turno para</p><div class="chips">';
      act.forEach(function(x){ h += '<button class="chip" data-mot="'+esc(x.id)+'">'+esc(x.label.replace(/^Consulta (de |por |para )/,''))+'</button>'; });
      h += '</div>';
    }
    return h + '</div>';
  }

  function porWhatsApp(m){
    return '<div class="card"><span class="k-label">'+esc(m.label)+'</span><h3 style="font-size:1.4rem;margin-bottom:8px">Coordinamos tu turno por WhatsApp</h3>'+
      '<p class="mini" style="font-size:.95rem;margin-bottom:18px">Te respondemos con la profesional, la sede y los horarios disponibles para tu consulta.</p>'+
      '<a class="btn btn-wa" data-wa-msg href="'+esc(ARF.waUrl('Hola! Quiero sacar turno para '+m.label))+'" target="_blank" rel="noopener">Pedir turno por WhatsApp</a></div>';
  }

  function slotsCard(){
    var first = st.slots[0];
    var profs = {}, sedes = {};
    st.slots.forEach(function(s){ profs[s.profesional]=1; sedes[s.sede]=1; });
    var multi = Object.keys(profs).length>1 || Object.keys(sedes).length>1;
    var m = mot(st.motivo);
    var nProfs = Object.keys(profs).length, nSedes = Object.keys(sedes).length;
    var h = '<div class="card">';
    // Dónde queda: lo primero que se ve, antes de los días.
    h += '<span class="k-label">Dónde te atendemos</span>';
    if (nSedes === 1) h += sedeCard(first.sede);
    else h += '<p class="mini" style="margin:-4px 0 12px">En San Miguel de Tucumán. Cada horario muestra en qué sede.</p>';
    // Quién atiende
    if (nProfs === 1) {
      h += '<div class="quien"><span class="bub"><svg class="ic"><use href="#i-user"/></svg></span><div><b>Te atiende '+esc(first.profesional)+'</b><small>'+esc(rolDe(m))+'</small></div></div>';
    } else {
      h += '<div style="height:10px"></div>';
    }
    // dias
    var days = [], seen = {};
    st.slots.forEach(function(s){ var p=parts(s.slot_iso); if(!seen[p.key]){ seen[p.key]=1; days.push(p); } });
    h += '<span class="k-label">Elegí día</span><div class="car" data-car="days"><button type="button" class="car-btn prev" aria-label="Días anteriores">‹</button><div class="days" role="radiogroup" aria-label="Día">';
    days.forEach(function(p){ h += '<button class="day" role="radio" aria-checked="'+(st.day===p.key)+'" data-day="'+p.key+'"><small>'+DIAS[dow(p)]+'</small><b>'+p.d+'/'+p.m+'</b></button>'; });
    var nDia = st.slots.filter(function(s){ return parts(s.slot_iso).key === st.day; }).length;
    h += '</div><button type="button" class="car-btn next" aria-label="Más días">›</button></div>';
    h += '<span class="k-label">Horarios disponibles'+(nDia?' · '+nDia:'')+'</span>';
    // Una fila por profesional: la persona ve quién la atiende antes de elegir.
    var grupos = [], gi = {};
    st.slots.forEach(function(s, i){
      if (parts(s.slot_iso).key !== st.day) return;
      var k = s.profesional + '|' + s.sede;
      if (gi[k] == null) { gi[k] = grupos.length; grupos.push({prof:s.profesional, sede:s.sede, items:[]}); }
      grupos[gi[k]].items.push({s:s, i:i});
    });
    var masDe4 = false;
    grupos.forEach(function(g, n){
      if (nProfs > 1 || nSedes > 1) {
        var hh = +parts(g.items[0].s.slot_iso).t.slice(0,2);
        h += '<p class="franja">'+(hh < 13 ? 'Mañana' : 'Tarde')+' <span>· te atiende '+esc(g.prof)+(nSedes>1?' en '+esc(sedeInfo(g.sede).n):'')+'</span></p>';
      }
      if (g.items.length > 4) masDe4 = true;
      h += '<div class="car" data-car="slots-'+n+'"><button type="button" class="car-btn prev" aria-label="Horarios anteriores">‹</button><div class="slots" role="radiogroup" aria-label="Horario con '+esc(g.prof)+'">';
      g.items.forEach(function(it){
        var on = st.slot && st.slot.slot_iso===it.s.slot_iso && st.slot.profesional===it.s.profesional;
        h += '<button class="slot" role="radio" aria-checked="'+on+'" data-slot="'+it.i+'">'+parts(it.s.slot_iso).t+'</button>';
      });
      h += '</div><button type="button" class="car-btn next" aria-label="Más horarios">›</button></div>';
    });
    if (masDe4) h += '<p class="car-hint">Deslizá para ver todos los horarios.</p>';
    return h + '</div>';
  }

  function resumen(){

    h += '<div class="poli"><b>¿Y si no podés ir?</b> Reprogramás sin costo, una vez. Para cancelar con devolución, avisanos hasta 48 h antes del turno.</div>';

    h += '</div>';
    h += '<form class="card form" id="frm" novalidate style="margin-top:14px">';
    h += '<label>Nombre y apellido *<input type="text" name="n" autocomplete="name" required placeholder="Como figura en tu DNI"></label>';
    h += '<div class="two"><label>WhatsApp *<input type="tel" name="p" autocomplete="tel" inputmode="tel" required placeholder="381 ..."></label>';
    h += '<label>Email (opcional)<input type="email" name="e" autocomplete="email" placeholder="tu@mail.com"></label></div>';
    h += '<p class="mini">Antes del turno te mandamos un recordatorio por WhatsApp. Si dejás tu mail, también te llega la confirmación y el comprobante.</p>';
    h += '<label class="chk"><input type="checkbox" name="ok" required><span>'+(resto > 0 ? 'Entiendo que la seña de '+money(cfg.deposit_ars)+' se descuenta de la consulta.' : 'Entiendo que pago la consulta completa de '+money(cfg.deposit_ars)+' al reservar, que puedo reprogramar una vez sin costo y que la cancelación con devolución se pide hasta 48 h antes del turno.')+'</span></label>';
    if (st.error) h += '<div class="err" role="alert">'+esc(st.error)+'</div>';
    h += '<button class="btn btn-solid" type="submit"'+(st.sending?' disabled':'')+'><svg class="ic"><use href="#i-lock"/></svg>'+(st.sending?'Generando el pago…':'Pagar '+money(cfg.deposit_ars)+' con Mercado Pago')+'</button>';
    h += '<p class="mini" style="text-align:center">Te llevamos a Mercado Pago para pagar de forma segura.</p></form>';
    return h;
  }

  function bind(prevCar){
    app.querySelectorAll('[data-cambiar]').forEach(function(b){ b.addEventListener('click', function(){ st.abierto = true; render(); var c=document.querySelector('.mot-list'); if(c && window.innerWidth < 1060) c.scrollIntoView({behavior:'smooth',block:'center'}); }); });
    app.querySelectorAll('[data-mot]').forEach(function(b){ b.addEventListener('click', function(){ pick(b.getAttribute('data-mot')); }); });
    app.querySelectorAll('[data-ayuda]').forEach(function(b){ b.addEventListener('click', function(){
      var a = AYUDA[+b.getAttribute('data-ayuda')];
      track('ViewContent', {content_name: 'ayuda: '+a.t});
      if (a.m && mot(a.m)) pick(a.m, a.t); else revisar();
    }); });
    app.querySelectorAll('[data-day]').forEach(function(b){ b.addEventListener('click', function(){ st.day=b.getAttribute('data-day'); st.slot=null; st.apartado=null; pararReloj(); render(); }); });
    app.querySelectorAll('[data-slot]').forEach(function(b){ b.addEventListener('click', function(){
      st.slot = st.slots[+b.getAttribute('data-slot')]; st.error=''; st.aviso=''; st.apartado=null; render();
      apartar(st.slot);
      // Embudo del pixel: eligio horario (una vez por motivo y por visita).
      trackUnaVez('AddToCart', 's_'+st.motivo, {value: st.cfg.deposit_ars, currency:'ARS', content_name: (mot(st.motivo)||{}).label, content_category: 'turnero'});
      if (window.innerWidth < 1060) { var c=document.getElementById('col3'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); }
    }); });
    var f = document.getElementById('frm');
    if (f) f.addEventListener('submit', submit);
    ARF.decorate(app);
    carInit(prevCar);
  }

  function submit(e){
    e.preventDefault();
    var f = e.target, n=f.n.value.trim(), p=f.p.value.trim(), em=f.e.value.trim();
    var err = '';
    if (n.length < 3) err = 'Ingresá tu nombre y apellido.';
    else if (p.replace(/\D/g,'').length < 10) err = 'Ingresá tu WhatsApp con característica (ej: 381 555 1234).';
    else if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) err = 'Revisá el email: parece mal escrito. Si no tenés, dejalo vacío.';
    else if (!f.ok.checked) err = 'Marcá la casilla para confirmar el pago de la consulta.';
    if (err) { st.error = err; render(); restore(n,p,em,f.ok.checked); return; }
    st.error=''; st.sending=true; render(); restore(n,p,em,true);
    ARF.api('/reserve', {method:'POST', body:{
      motivo: st.motivo, slot_iso: st.slot.slot_iso, profesional: st.slot.profesional,
      patient_name: n, patient_phone: p, patient_email: em, visitor: VID
    }}).then(function(r){
      track('InitiateCheckout', {value: st.cfg.deposit_ars, currency:'ARS', content_name: mot(st.motivo).label}, r.booking_id);
      location.href = r.init_point;
    }).catch(function(e2){
      st.sending=false;
      st.error = e2.message || 'No pudimos generar el pago. Probá de nuevo.';
      if (e2.status === 409) { st.slot=null; st.apartado=null; pararReloj(); loadSlots(); return; }
      render(); restore(n,p,em,true);
    });
  }
  function restore(n,p,em,ok){ var f=document.getElementById('frm'); if(!f)return; f.n.value=n; f.p.value=p; f.e.value=em; f.ok.checked=!!ok; }

  // ---------- pantalla de vuelta de MP ----------
  function resultado(estado, ref, intento){
    ARF.api('/estado/'+encodeURIComponent(ref)).then(function(b){
      if (b.status === 'paid') return pintarOk(b, ref);
      if (b.status === 'paid_conflict') return pintarMsg('Recibimos tu pago','El horario se ocupó mientras pagabas. Te escribimos por WhatsApp para darte otro turno. No perdés tu pago.', true);
      if (estado === 'error' || b.status === 'cancelled') return pintarMsg('El pago no se completó','No se te cobró nada. Podés intentar de nuevo o elegir otro horario.', false, true);
      if (b.status === 'expired' && estado !== 'ok') return pintarMsg('El horario se liberó','Pasaron más de 15 minutos sin pago. Elegí un horario de nuevo.', false, true);
      if (intento < 12) { pintarEspera(); setTimeout(function(){ resultado(estado, ref, intento+1); }, 3000); return; }
      pintarMsg('Estamos confirmando tu pago','Mercado Pago todavía no nos avisó. Apenas se acredite te llega la confirmación por mail. Si tenés dudas, escribinos.', true);
    }).catch(function(){
      pintarMsg('Estamos confirmando tu pago','Si ya pagaste, te llega la confirmación por mail. Ante cualquier duda escribinos por WhatsApp.', true);
    });
  }
  function pintarEspera(){ app.innerHTML = '<div class="res"><div class="spinner" role="status"></div><h1>Confirmando tu pago…</h1><p class="tn-lead" style="margin:8px auto 0">Esto tarda unos segundos.</p></div>'; }
  function pintarOk(b, ref){
    if (!sessionStorage.getItem('arf_p_'+ref)) { track('Purchase', {value: b.deposit_ars, currency:'ARS', content_name: b.motivo}, ref); try{ sessionStorage.setItem('arf_p_'+ref,'1'); }catch(e){} }
    var resto = Math.max(0,(b.consulta_ars||0)-(b.deposit_ars||0));
    app.innerHTML = '<div class="res"><div class="ok-ic"><svg class="ic"><use href="#i-check"/></svg></div>'+
      '<h1>¡Turno <span class="it">confirmado</span>!</h1><p class="tn-lead" style="margin:8px auto 0">Recibimos tu '+(resto > 0 ? 'seña' : 'pago')+' de '+money(b.deposit_ars)+'. Antes del turno te mandamos un recordatorio por WhatsApp. Si dejaste tu mail, ahí te llega la confirmación y el comprobante.</p>'+
      '<div class="card"><span class="k-label">'+esc(b.motivo)+'</span>'+
      '<p><b>'+esc(whenLabel(b.scheduled_at))+'</b><br><span class="mini">Llegá 10 minutos antes</span></p>'+
      '<p style="margin-top:10px"><b>'+esc(b.profesional||'')+'</b> · '+esc(b.sede||'')+'</p>'+
      (resto > 0 ? '<p class="mini" style="margin-top:10px">Abonás en la consulta: <b>'+money(resto)+'</b></p>' : '<p class="mini" style="margin-top:10px">La consulta ya está paga: ese día no abonás nada.</p>')+
      (b.bonificable?'<p class="mini" style="margin-top:6px">Si ese día arrancás tu tratamiento, los '+money(b.consulta_ars)+' que pagaste se descuentan del tratamiento: la consulta te sale gratis.</p>':'')+'</div>'+
      '<a class="btn btn-wa" href="https://wa.me/5493815477474" target="_blank" rel="noopener">Hablar con ARF por WhatsApp</a></div>';
    ARF.decorate(app);
  }
  function pintarMsg(t, p, wa, retry){
    app.innerHTML = '<div class="res"><div class="em-ic" style="width:76px;height:76px;border-radius:50%;background:#F0EBF5;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--muted)"><svg class="ic" style="width:32px;height:32px"><use href="#i-alert"/></svg></div>'+
      '<h1>'+esc(t)+'</h1><p class="tn-lead" style="margin:8px auto 24px">'+esc(p)+'</p>'+
      (retry?'<a class="btn btn-solid" href="/turno/">Elegir horario de nuevo</a> ':'')+
      (wa?'<a class="btn btn-wa" href="https://wa.me/5493815477474" target="_blank" rel="noopener">Escribinos por WhatsApp</a>':'')+'</div>';
    ARF.decorate(app);
  }
})();
</script>
</body>
</html>
